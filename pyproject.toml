[project]
name = "defense-rl-gym"
version = "0.1.0"
description = "Defensive-security RL environments with rewards that are hard to game: vulnerability patching and incident response"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
rl = ["torch>=2.3"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
drg = "drg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drg.patch" = ["support.py", "runner.py"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains policies or runs the full studies"]
