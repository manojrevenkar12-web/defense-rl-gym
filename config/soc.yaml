# The incident-response environment: a small company network, an intrusion that unfolds in time,
# and the defender's costs. A tick is five minutes.

horizon: 48                 # ticks the defender has
grace: 24                   # ticks the attack keeps running after the defender submits
action_ticks: {search: 1, inspect: 1, isolate: 1, disable: 1, wait: 1, submit: 0}

families:
  corp-small:
    workstations: [6, 9]
    admins: [1, 2]
    initial_access: {phish: 0.6, spray: 0.4}
    lateral_hops: [1, 2]
    exfil: {dns: 0.5, https: 0.5}
    admin_remote_rate: 0.10     # per admin per tick: a legitimate remote logon to a server
    it_task_rate: 0.03          # per tick: IT creates a scheduled task somewhere
    encoded_ps_rate: 0.01       # per admin per tick: an admin runs an encoded PowerShell script
    backup_ticks: [20, 30]      # when the nightly backup pulls data from the file server
    helpdesk_rate: 0.04         # per tick: an admin logs on to a user's workstation to help
    macro_rate: 0.01            # per user per tick: an Excel macro starts cmd.exe for a report
    appdata_task_rate: 0.02     # per tick: an updater registers a task under a user's AppData
    cdn_rate: 0.03              # per user per tick: a CDN name with a long hashed label
    upload_rate: 0.01           # per user per tick: a large upload to cloud storage
    stealth: 0.3                # chance each attack step uses a variant the simple detectors miss
  corp-medium:
    workstations: [12, 16]
    admins: [2, 3]
    initial_access: {phish: 0.6, spray: 0.4}
    lateral_hops: [1, 3]
    exfil: {dns: 0.5, https: 0.5}
    admin_remote_rate: 0.10
    it_task_rate: 0.04
    encoded_ps_rate: 0.01
    backup_ticks: [20, 30]
    helpdesk_rate: 0.06
    macro_rate: 0.01
    appdata_task_rate: 0.03
    cdn_rate: 0.03
    upload_rate: 0.01
    stealth: 0.3
  noisy-admins:
    workstations: [6, 9]
    admins: [2, 3]
    initial_access: {phish: 0.6, spray: 0.4}
    lateral_hops: [1, 2]
    exfil: {dns: 0.5, https: 0.5}
    admin_remote_rate: 0.25
    it_task_rate: 0.10
    encoded_ps_rate: 0.06
    backup_ticks: [20, 30]
    helpdesk_rate: 0.15
    macro_rate: 0.03
    appdata_task_rate: 0.06
    cdn_rate: 0.05
    upload_rate: 0.02
    stealth: 0.3

rewards:
  naive:                    # the reward a first version would ship: was the attack stopped?
    contained: 1.0
  robust:
    contained: 1.0
    isolated_benign_workstation: -0.2
    isolated_benign_server: -0.6
    isolated_domain_controller: -1.0
    per_tick: -0.005
    compromised_isolated_share: 0.3

max_hosts: 20               # observation padding for the learned policy
